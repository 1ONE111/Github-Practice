name: Build Windows exe

# 선택 사항: 로컬에서 build.bat 으로 만들어도 된다.
# Actions 탭에서 수동 실행(버전 입력 시 Release 생성)하거나 v* 태그를 올리면 exe 를 만든다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 태그 (예: v2.0.0). 비우면 Artifacts 로만 exe 저장"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller --noconfirm --clean NaverCrawler.spec
      - name: Self test
        shell: pwsh
        run: |
          # 러너에 설치된 크롬을 실제로 띄워 본다 (드라이버는 Selenium Manager 가 자동 설치)
          $env:NAVER_CRAWLER_HOME = "$env:RUNNER_TEMP\nc-home"
          $p = Start-Process -FilePath dist\NaverCrawler.exe -ArgumentList '--selftest','--browser' -Wait -PassThru
          Get-Content "$env:NAVER_CRAWLER_HOME\selftest.log"
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NaverCrawler
          path: dist/NaverCrawler.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
        run: gh release create "$env:TAG" dist/NaverCrawler.exe --target "${{ github.sha }}" --title "네이버 크롤러 $env:TAG" --generate-notes
